<body>

    <header class="site-header">
        <div class="header-content">
            <h1><a href="index.html">Alessandro Fenu</a></h1>
            <nav class="site-nav">

            </button>
        </div>
    </header>

    <main>
        <section class="section">
            <h2>Compute!</h2>
            <p>Exact integral homology of the unordered configuration spaces
                <span class="tex" data-tex="B_k(S) = \{\text{$k$ distinct unordered points in } S\}"></span>.
                Type a degree and a number of points, and pick the surface.</p>

            <div class="formula-box">
                <div class="formula" id="formula">
                    <span class="tex" data-tex="H"></span>
                    <span class="sub"><input id="in-i" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="i" aria-label="Degree i"></span>
                    <span class="tex" data-tex="\big("></span>
                    <span class="tex" data-tex="B"></span>
                    <span class="sub"><input id="in-k" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="k" aria-label="Number of points k"></span>
                    <span class="tex" data-tex="("></span>
                    <span class="space-wrap">
                        <button class="space-btn" id="space-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Surface">
                            <span id="space-tex"></span><i class="fas fa-caret-down"></i>
                        </button>
                        <ul class="space-menu" id="space-menu" role="listbox" aria-label="Surface"></ul>
                    </span>
                    <span class="tex" data-tex=")"></span>
                    <span class="tex" data-tex="\big)"></span>
                </div>

                <div class="result hint" id="result" aria-live="polite">Type a degree i and a number of points k.</div>
                <div class="details-line" id="details"></div>

                <div class="oor" id="oor">
                    <p id="oor-intro"></p>
                    <button class="btn" id="calc-btn"><i class="fas fa-play"></i>&nbsp; Calculate</button>
                    <button class="btn secondary" id="cancel-btn" style="display:none"><i class="fas fa-stop"></i>&nbsp; Cancel</button>
                    <div class="run-status" id="run-status"></div>
                </div>

                <details class="all" id="all" style="display:none">
                    <summary id="all-summary">All degrees</summary>
                    <table class="all-table"><tbody id="all-body"></tbody></table>
                </details>
            </div>

        </section>
    </main>

    <script>
    (() => {
        // ------------------------------------------------------------------ spaces
        // maxDeg(k): H_i(B_k(S)) = 0 for i > maxDeg(k), because the cell complexes have no Borel-Moore cells
        // below degree 2k - maxDeg(k) - 1.
        // bench: single-core native measurements {k: [seconds, MB]} of the engine (C++ for the torus, CPython
        // for the plane and annulus); the estimates scale them by the measured browser overhead below.
        const SPACES = {
            torus: {
                tex: 'T^2', name: 'Torus', engine: 'ho', pu: false, maxDeg: k => k + 1,
                bench: { 28: [5.13, 154], 29: [6.91, 208], 30: [12.1, 318], 31: [18.8, 430], 32: [44.0, 655], 33: [82.7, 883] }
            },
            punctured: {
                tex: 'T^2 \\smallsetminus \\mathrm{pt}', name: 'Punctured torus', engine: 'ho', pu: true, maxDeg: k => k,
                bench: { 28: [3.01, 130], 29: [4.26, 181], 30: [6.99, 265], 31: [9.83, 372], 32: [16.1, 542], 33: [22.7, 762] }
            },
            annulus: {
                tex: 'S^1 \\times \\mathbb{R}', name: 'Annulus (open)', engine: 'py', surface: 'annulus', maxDeg: k => k,
                bench: { 9: [0.28, 28], 10: [1.56, 28], 11: [12.0, 36], 12: [113, 60] }
            },
            plane: {
                tex: '\\mathbb{R}^2', name: 'Plane (braid groups)', engine: 'py', surface: 'plane', maxDeg: k => Math.max(k - 1, 0),
                bench: { 10: [0.19, 28], 11: [1.3, 28], 12: [9.4, 36], 13: [96.7, 60] }
            }
        };
        const ORDER = ['torus', 'punctured', 'annulus', 'plane'];
        // Browser overhead relative to the native benchmark: time factor, memory factor, fixed MB (runtime itself).
        const OVERHEAD = { ho: [1.6, 1.0, 20], py: [2.5, 1.0, 150] };
        const WASM_LIMIT_MB = 4096;                 // a WebAssembly (wasm32) instance cannot address more

        let DATA = null;                            // compute/data.json
        let space = 'torus';
        const computed = loadCache();               // results computed in this browser: {space: {k: H}}
        let worker = null, timer = null;

        // ------------------------------------------------------------------ helpers
        const $ = id => document.getElementById(id);
        const tex = (s, display = false) => katex.renderToString(s, { throwOnError: false, displayMode: display });
        document.querySelectorAll('.tex').forEach(el => { el.innerHTML = tex(el.dataset.tex); });

        function loadCache() {
            try { return JSON.parse(localStorage.getItem('compute-cache-v1')) || {}; } catch (e) { return {}; }
        }
        function saveCache() {
            try { localStorage.setItem('compute-cache-v1', JSON.stringify(computed)); } catch (e) { /* private mode */ }
        }

        // A group is [rank, d1, m1, d2, m2, ...]  =  Z^rank + (Z/d1)^m1 + ...
        function groupTex(g) {
            const parts = [];
            if (g[0] === 1) parts.push('\\mathbb{Z}');
            else if (g[0] > 1) parts.push(`\\mathbb{Z}^{${g[0]}}`);
            for (let j = 1; j < g.length; j += 2) {
                const d = g[j], m = g[j + 1];
                parts.push(m === 1 ? `\\mathbb{Z}/${d}` : `(\\mathbb{Z}/${d})^{${m}}`);
            }
            return parts.length ? parts.join(' \\oplus ') : '0';
        }

        // p-primary decomposition of the torsion, as {p: {exponent: multiplicity}}
        function primaryTex(g) {
            const prim = {};
            for (let j = 1; j < g.length; j += 2) {
                let d = BigInt(g[j]); const m = g[j + 1];
                for (let p = 2n; p * p <= d; p++) {
                    let e = 0; while (d % p === 0n) { d /= p; e++; }
                    if (e) { prim[p] = prim[p] || {}; prim[p][e] = (prim[p][e] || 0) + m; }
                }
                if (d > 1n) { prim[d] = prim[d] || {}; prim[d][1] = (prim[d][1] || 0) + m; }
            }
            const parts = [];
            Object.keys(prim).map(BigInt).sort((a, b) => (a < b ? -1 : 1)).forEach(p => {
                Object.keys(prim[p]).map(Number).sort((a, b) => a - b).forEach(e => {
                    const q = e === 1 ? `${p}` : `${p}^{${e}}`, m = prim[p][e];
                    parts.push(m === 1 ? `\\mathbb{Z}/${q}` : `(\\mathbb{Z}/${q})^{${m}}`);
                });
            });
            return parts.join(' \\oplus ');
        }

        const hasTorsion = g => g.length > 1;
        const needsPrimary = g => {           // only worth showing when some invariant factor is not a prime power
            for (let j = 1; j < g.length; j += 2) {
                let d = BigInt(g[j]), n = 0;
                for (let p = 2n; p * p <= d; p++) if (d % p === 0n) { n++; while (d % p === 0n) d /= p; }
                if (d > 1n) n++;
                if (n > 1) return true;
            }
            return false;
        };

        // ------------------------------------------------------------------ BM -> ordinary
        function runs(factors) {
            const c = new Map();
            factors.map(String).forEach(f => c.set(f, (c.get(f) || 0) + 1));
            return [...c.entries()].sort((a, b) => (BigInt(a[0]) < BigInt(b[0]) ? -1 : 1))
                .flatMap(([d, m]) => [Number.isSafeInteger(Number(d)) ? Number(d) : d, m]);
        }
        function invariantFromPrimary(prim) {          // {p: [valuations]} -> [d_1 | d_2 | ...]
            const n = Math.max(0, ...Object.values(prim).map(v => v.length));
            const fs = Array(n).fill(1n);
            for (const [p, vals] of Object.entries(prim)) {
                [...vals].sort((a, b) => b - a).forEach((v, j) => { fs[n - 1 - j] *= BigInt(p) ** BigInt(v); });
            }
            return fs.map(String);
        }
        function ordinaryFromBM(k, bm, format) {
            const get = n => {
                const e = bm[String(n)];
                if (!e) return [0, []];
                return [e[0], format === 'bm-primary' ? invariantFromPrimary(e[1]) : e[1]];
            };
            const H = [];
            for (let i = 0; i <= 2 * k; i++) H.push([get(2 * k - i)[0], ...runs(get(2 * k - i - 1)[1])]);
            while (H.length > 1 && H[H.length - 1].length === 1 && H[H.length - 1][0] === 0) H.pop();
            return H;
        }

        // ------------------------------------------------------------------ estimates
        function estimate(sp, k) {
            const S = SPACES[sp], ks = Object.keys(S.bench).map(Number).sort((a, b) => a - b);
            const last = ks[ks.length - 1], first = ks[Math.max(0, ks.length - 4)];
            const val = (j, kk) => {
                if (S.bench[kk]) return S.bench[kk][j];
                const ratio = Math.pow(S.bench[last][j] / S.bench[first][j], 1 / (last - first));
                return S.bench[last][j] * Math.pow(ratio, kk - last);
            };
            const [ft, fm, base] = OVERHEAD[S.engine];
            return { secs: val(0, k) * ft, mb: val(1, k) * fm + base };
        }
        const fmtTime = s => {
            if (!isFinite(s) || s > 3.15e9) return 'centuries';
            if (s < 60) return `${Math.max(1, Math.round(s))} s`;
            if (s < 3600) return `${Math.round(s / 60)} min`;
            if (s < 86400 * 2) return `${(s / 3600).toFixed(s < 36000 ? 1 : 0)} h`;
            if (s < 86400 * 365) return `${Math.round(s / 86400)} days`;
            return `${(s / 86400 / 365).toPrecision(2)} years`;
        };
        const fmtHours = s => {
            const h = s / 3600;
            if (!isFinite(h) || h > 1e15) return 'more than 10<sup>15</sup> hours';
            if (h < 0.1) return 'less than 0.1 hours';
            const r = h < 10 ? Number(h.toPrecision(2)) : Math.round(Number(h.toPrecision(2)));
            return `${r.toLocaleString('en-US')} ${r === 1 ? 'hour' : 'hours'}`;
        };

        // ------------------------------------------------------------------ space selector
        const menu = $('space-menu'), btn = $('space-btn');
        ORDER.forEach(sp => {
            const li = document.createElement('li');
            li.setAttribute('role', 'option');
            li.dataset.space = sp;
            li.innerHTML = `${tex(SPACES[sp].tex)}<span>${SPACES[sp].name}</span>`;
            li.addEventListener('click', () => { setSpace(sp); closeMenu(); btn.focus(); });
            menu.appendChild(li);
        });
        function setSpace(sp) {
            space = sp;
            $('space-tex').innerHTML = tex(SPACES[sp].tex);
            menu.querySelectorAll('li').forEach(li => li.setAttribute('aria-selected', li.dataset.space === sp));
            update();
        }
        let focusIdx = 0;
        function openMenu() {
            menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
            focusIdx = ORDER.indexOf(space); markFocus();
        }
        function closeMenu() { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
        function markFocus() { menu.querySelectorAll('li').forEach((li, j) => li.classList.toggle('focused', j === focusIdx)); }
        btn.addEventListener('click', e => { e.stopPropagation(); menu.classList.contains('open') ? closeMenu() : openMenu(); });
        btn.addEventListener('keydown', e => {
            const open = menu.classList.contains('open');
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!open) return openMenu();
                focusIdx = (focusIdx + (e.key === 'ArrowDown' ? 1 : ORDER.length - 1)) % ORDER.length; markFocus();
            } else if ((e.key === 'Enter' || e.key === ' ') && open) {
                e.preventDefault(); setSpace(ORDER[focusIdx]); closeMenu();
            } else if (e.key === 'Escape') closeMenu();
        });
        document.addEventListener('click', e => { if (!e.target.closest('.space-wrap')) closeMenu(); });

        // ------------------------------------------------------------------ inputs
        const inI = $('in-i'), inK = $('in-k');
        [inI, inK].forEach(inp => {
            inp.addEventListener('input', () => {
                const clean = inp.value.replace(/\D/g, '').slice(0, 4);
                if (clean !== inp.value) inp.value = clean;
                fit(inp); update();
            });
        });
        inI.addEventListener('keydown', e => { if (e.key === 'Enter' || (e.key === 'ArrowRight' && inI.selectionStart === inI.value.length)) { e.preventDefault(); inK.focus(); } });
        inK.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' && inK.selectionStart === 0) { e.preventDefault(); inI.focus(); } });
        function fit(inp) { inp.style.width = Math.max(1.3, inp.value.length * 1.05 + 0.25) + 'ch'; }

        // ------------------------------------------------------------------ main update
        function lookup(sp, k) {                  // ordinary homology list for (sp, k), or null
            if (DATA && DATA[sp] && DATA[sp].H[k]) return { H: DATA[sp].H[k], src: 'table' };
            if (computed[sp] && computed[sp][k]) return { H: computed[sp][k], src: 'browser' };
            return null;
        }

        function update() {
            const iS = inI.value, kS = inK.value;
            const S = SPACES[space];
            const res = $('result'), det = $('details');
            $('oor').classList.remove('show');
            $('all').style.display = 'none';
            try {
                const q = new URLSearchParams({ space });
                if (iS) q.set('i', iS); if (kS) q.set('k', kS);
                history.replaceState(null, '', '?' + q.toString());
            } catch (e) { /* file:// */ }

            if (iS === '' || kS === '') {
                res.className = 'result hint';
                res.textContent = iS === '' && kS === '' ? 'Type a degree i and a number of points k.'
                    : iS === '' ? 'Now type the degree i.' : 'Now type the number of points k.';
                det.innerHTML = '';
                return;
            }
            if (!DATA) { res.className = 'result hint'; res.textContent = 'Loading the tables…'; det.innerHTML = ''; return; }

            const i = parseInt(iS, 10), k = parseInt(kS, 10);
            const found = lookup(space, k);
            const lhs = `H_{${i}}\\big(B_{${k}}(${S.tex})\\big)`;

            if (found) {
                const g = found.H[i] || [0];
                res.className = 'result';
                res.innerHTML = tex(`\\cong ${groupTex(g)}`);
                det.innerHTML = '';
                fillAll(found.H, k, i);
                return;
            }

            // Outside every table: settle what theory settles, otherwise offer the computation.
            if (i === 0) {
                res.className = 'result'; res.innerHTML = tex('\\cong \\mathbb{Z}');
                det.innerHTML = '';
                return;
            }
            if (i > S.maxDeg(k)) {
                res.className = 'result'; res.innerHTML = tex('\\cong 0');
                det.innerHTML = '';
                return;
            }
            res.className = 'result hint';
            res.innerHTML = `${tex(lhs)} is not in the precomputed table.`;
            det.innerHTML = '';
            showOOR(k);
        }

        function torsionOrder(g) {
            const parts = [];
            for (let j = 1; j < g.length; j += 2) parts.push(g[j + 1] === 1 ? `${g[j]}` : `${g[j]}^{${g[j + 1]}}`);
            return parts.join(' \\cdot ');
        }

        function fillAll(H, k, cur) {
            const body = $('all-body'); body.innerHTML = '';
            H.forEach((g, j) => {
                const tr = document.createElement('tr');
                if (j === cur) tr.className = 'current';
                tr.innerHTML = `<td>${tex(`H_{${j}}`)}</td><td>${tex(groupTex(g))}</td>`;
                tr.addEventListener('click', () => { inI.value = String(j); fit(inI); update(); });
                body.appendChild(tr);
            });
            $('all-summary').innerHTML = `All degrees of ${tex(`H_*\\big(B_{${k}}(${SPACES[space].tex})\\big)`)}`;
            $('all').style.display = 'block';
        }

        // ------------------------------------------------------------------ out of range
        function showOOR(k) {
            const { secs, mb } = estimate(space, k);
            const running = worker !== null;
            const allow = mb <= WASM_LIMIT_MB * 0.95;
            $('oor').classList.add('show');
            $('oor-intro').innerHTML = `Estimated time: ${fmtHours(secs)}.` + (allow ? '' : ' Too large for a browser.');
            $('calc-btn').disabled = !allow || running;
            $('calc-btn').style.display = running ? 'none' : '';
            $('cancel-btn').style.display = running ? '' : 'none';
            if (!running && !$('run-status').classList.contains('error')) $('run-status').innerHTML = '';
        }

        $('calc-btn').addEventListener('click', () => {
            const k = parseInt(inK.value, 10), sp = space, S = SPACES[sp];
            const t0 = performance.now();
            let started = null;
            worker = new Worker('compute/worker.js');
            $('run-status').className = 'run-status';
            const status = msg => {
                const el = ((started ? performance.now() - started : performance.now() - t0) / 1000);
                $('run-status').innerHTML = `<i class="fas fa-spinner fa-spin"></i>${msg} ${started ? `(${fmtTime(el)})` : ''}`;
            };
            let lastMsg = 'Starting…';
            status(lastMsg);
            timer = setInterval(() => status(lastMsg), 1000);
            const finish = () => { clearInterval(timer); timer = null; if (worker) worker.terminate(); worker = null; };
            worker.onmessage = e => {
                const m = e.data;
                if (m.type === 'status') { lastMsg = m.message; if (m.started) started = performance.now(); status(lastMsg); }
                else if (m.type === 'done') {
                    finish();
                    computed[sp] = computed[sp] || {};
                    computed[sp][k] = ordinaryFromBM(k, m.bm, m.format);
                    saveCache();
                    $('run-status').innerHTML = '';
                    if (space === sp && parseInt(inK.value, 10) === k) update();
                } else if (m.type === 'error') {
                    finish();
                    $('run-status').className = 'run-status error';
                    $('run-status').innerHTML = `<i class="fas fa-triangle-exclamation"></i> The computation failed: ${m.message}`;
                    update();
                }
            };
            worker.onerror = e => {
                finish();
                $('run-status').className = 'run-status error';
                $('run-status').innerHTML = `<i class="fas fa-triangle-exclamation"></i> The computation failed${e.message ? ': ' + e.message : ''}. This usually means the browser ran out of memory.`;
                update();
            };
            worker.postMessage({ engine: S.engine, k, pu: !!S.pu, surface: S.surface });
            update();
        });

        $('cancel-btn').addEventListener('click', () => {
            if (worker) { worker.terminate(); worker = null; }
            clearInterval(timer); timer = null;
            $('run-status').className = 'run-status';
            $('run-status').innerHTML = 'Cancelled.';
            update();
        });

        // ------------------------------------------------------------------ start
        const menuToggle = document.querySelector('.menu-toggle');
        menuToggle.addEventListener('click', () => document.querySelector('.site-nav').classList.toggle('open'));

        const q = new URLSearchParams(location.search);
        if (SPACES[q.get('space')]) space = q.get('space');
        if (/^\d{1,4}$/.test(q.get('i') || '')) inI.value = q.get('i');
        if (/^\d{1,4}$/.test(q.get('k') || '')) inK.value = q.get('k');
        fit(inI); fit(inK);
        setSpace(space);
        fetch('compute/data.json').then(r => r.json()).then(d => { DATA = d; update(); })
            .catch(() => { $('result').className = 'result hint'; $('result').textContent = 'Could not load the tables (compute/data.json).'; });
    })();
    </script>
</body>
</html>
